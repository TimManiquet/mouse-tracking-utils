<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mouse-tracking toolbox workflow</title>
    <style>
      :root { color-scheme: light; font: 14px/1.45 system-ui, sans-serif; color: #172033; background: #f6f8fb; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; }
      header { max-width: 1100px; margin: 0 auto 18px; }
      h1 { margin: 0 0 5px; font-size: 1.5rem; }
      p { margin: 0; color: #4b5567; }
      main { max-width: 1100px; margin: auto; }
      .toolbar { display: flex; gap: 20px; flex-wrap: wrap; margin: 16px 0; }
      form { background: white; border: 1px solid #d5dce8; border-radius: 10px; padding: 14px; display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
      fieldset { border: 0; padding: 0; margin: 0; display: contents; }
      label { display: grid; gap: 4px; font-weight: 600; }
      input, select, button { font: inherit; border: 1px solid #aeb9ca; border-radius: 6px; padding: 7px 9px; background: white; color: inherit; }
      input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #5b8def; outline-offset: 2px; }
      input { min-width: 170px; }
      button { cursor: pointer; background: #173f80; border-color: #173f80; color: white; font-weight: 650; }
      button:hover { background: #0f326a; }
      #status { min-height: 1.5em; margin: 8px 0; color: #35445c; }
      #status[data-error="true"] { color: #a41f2d; }
      .map-frame { background: white; border: 1px solid #d5dce8; border-radius: 10px; overflow: auto; }
      svg { display: block; min-width: 100%; }
      .edge { stroke: #8794a8; stroke-width: 2; fill: none; }
      .edge-label { fill: #59667a; font-size: 11px; text-anchor: middle; }
      .node rect { stroke-width: 1.5; rx: 10; }
      .node text { pointer-events: none; }
      .node .title { fill: #172033; font-size: 13px; font-weight: 700; }
      .node .details { fill: #4b5567; font-size: 11px; }
      .category-input rect { fill: #eaf2ff; stroke: #6b91cf; }
      .category-utility rect { fill: #edf7f0; stroke: #61a477; }
      .category-data rect { fill: #f2edff; stroke: #8e75c7; }
      .category-output rect { fill: #fff4e5; stroke: #d49a45; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 2px 0; color: #536075; font-size: 12px; }
      .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
      .legend .input::before { background: #eaf2ff; border: 1px solid #6b91cf; }
      .legend .utility::before { background: #edf7f0; border: 1px solid #61a477; }
      .legend .data::before { background: #f2edff; border: 1px solid #8e75c7; }
      .legend .output::before { background: #fff4e5; border: 1px solid #d49a45; }
      @media (max-width: 650px) { body { padding: 14px; } form { align-items: stretch; } label, input, select { width: 100%; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Mouse-tracking toolbox workflow</h1>
      <p>Follow the arrows from raw data through preprocessing and analysis. Add utilities or dependencies as the toolbox grows.</p>
    </header>
    <main>
      <div class="toolbar">
        <form id="utility-form" aria-label="Add a workflow utility">
          <fieldset>
            <label>Utility name <input name="label" maxlength="80" required placeholder="e.g. align_trials"></label>
            <label>Short description <input name="details" maxlength="240" placeholder="What it takes or returns"></label>
            <label>Type
              <select name="category">
                <option value="utility">Utility</option>
                <option value="input">Input</option>
                <option value="data">Data object</option>
                <option value="output">Output</option>
              </select>
            </label>
            <button type="submit">Add box</button>
          </fieldset>
        </form>
        <form id="dependency-form" aria-label="Connect workflow utilities">
          <fieldset>
            <label>Comes from <select name="from" required></select></label>
            <label>Feeds into <select name="to" required></select></label>
            <button type="submit">Add arrow</button>
          </fieldset>
        </form>
      </div>
      <p id="status" role="status" aria-live="polite">Loading workflow map…</p>
      <section class="map-frame" aria-label="Workflow diagram">
        <svg id="map" role="img" aria-labelledby="map-title map-desc">
          <title id="map-title">Mouse-tracking toolbox workflow diagram</title>
          <desc id="map-desc">Boxes represent utilities or data; arrows point from inputs to dependent steps.</desc>
          <defs>
            <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
              <path d="M0,0 L10,4 L0,8 z" fill="#8794a8"></path>
            </marker>
          </defs>
          <g id="edges"></g>
          <g id="nodes"></g>
        </svg>
      </section>
      <div class="legend" aria-label="Node type legend">
        <span class="input">Input</span><span class="utility">Utility</span><span class="data">Data object</span><span class="output">Output</span>
      </div>
    </main>
    <script>
      const svgNs = "http://www.w3.org/2000/svg";
      const mapElement = document.querySelector("#map");
      const edgesElement = document.querySelector("#edges");
      const nodesElement = document.querySelector("#nodes");
      const statusElement = document.querySelector("#status");
      let workflow;

      function setStatus(message, isError = false) {
        statusElement.textContent = message;
        statusElement.dataset.error = String(isError);
      }

      async function request(path, options) {
        const response = await fetch(path, options);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Request failed.");
        return result;
      }

      function svgElement(name, attributes = {}) {
        const element = document.createElementNS(svgNs, name);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value));
        return element;
      }

      function positionsFor(data) {
        const indegree = new Map(data.nodes.map((node) => [node.id, 0]));
        const outgoing = new Map(data.nodes.map((node) => [node.id, []]));
        for (const edge of data.edges) {
          indegree.set(edge.to, indegree.get(edge.to) + 1);
          outgoing.get(edge.from).push(edge.to);
        }
        const rank = new Map(data.nodes.map((node) => [node.id, 0]));
        const queue = data.nodes.filter((node) => indegree.get(node.id) === 0).map((node) => node.id);
        for (let index = 0; index < queue.length; index++) {
          const source = queue[index];
          for (const target of outgoing.get(source)) {
            rank.set(target, Math.max(rank.get(target), rank.get(source) + 1));
            indegree.set(target, indegree.get(target) - 1);
            if (indegree.get(target) === 0) queue.push(target);
          }
        }
        const columns = new Map();
        for (const node of data.nodes) {
          const level = rank.get(node.id);
          if (!columns.has(level)) columns.set(level, []);
          columns.get(level).push(node);
        }
        const result = new Map();
        for (const [level, nodes] of columns) {
          nodes.forEach((node, index) => result.set(node.id, { x: 35 + level * 295, y: 30 + index * 112 }));
        }
        const height = Math.max(220, ...[...columns.values()].map((nodes) => nodes.length * 112 + 60));
        const width = Math.max(850, (Math.max(...columns.keys()) + 1) * 295 + 20);
        return { result, width, height };
      }

      function render(data) {
        workflow = data;
        const { result: positions, width, height } = positionsFor(data);
        mapElement.setAttribute("width", width);
        mapElement.setAttribute("height", height);
        mapElement.setAttribute("viewBox", `0 0 ${width} ${height}`);
        edgesElement.replaceChildren();
        nodesElement.replaceChildren();

        for (const edge of data.edges) {
          const from = positions.get(edge.from);
          const to = positions.get(edge.to);
          const startX = from.x + 230;
          const startY = from.y + 36;
          const endX = to.x;
          const endY = to.y + 36;
          edgesElement.append(svgElement("path", {
            class: "edge",
            d: `M ${startX} ${startY} C ${startX + 36} ${startY}, ${endX - 36} ${endY}, ${endX - 6} ${endY}`,
            "marker-end": "url(#arrow)"
          }));
          if (edge.label) {
            const text = svgElement("text", { class: "edge-label", x: (startX + endX) / 2, y: (startY + endY) / 2 - 5 });
            text.textContent = edge.label;
            edgesElement.append(text);
          }
        }

        for (const node of data.nodes) {
          const { x, y } = positions.get(node.id);
          const group = svgElement("g", { class: `node category-${node.category}` });
          group.append(svgElement("rect", { x, y, width: 230, height: 72, rx: 10 }));
          const title = svgElement("text", { class: "title", x: x + 12, y: y + 24 });
          title.textContent = node.label;
          const details = svgElement("text", { class: "details", x: x + 12, y: y + 46 });
          details.textContent = node.details.length > 34 ? `${node.details.slice(0, 33)}…` : node.details;
          const titleElement = svgElement("title");
          titleElement.textContent = `${node.label}: ${node.details}`;
          group.append(title, details, titleElement);
          nodesElement.append(group);
        }
        populateSelects(data.nodes);
      }

      function populateSelects(nodes) {
        for (const select of document.querySelectorAll("#dependency-form select")) {
          const oldValue = select.value;
          select.replaceChildren();
          for (const node of nodes) {
            const option = document.createElement("option");
            option.value = node.id;
            option.textContent = node.label;
            select.append(option);
          }
          if (nodes.some((node) => node.id === oldValue)) select.value = oldValue;
        }
      }

      async function refresh(message) {
        render(await request("/api/workflow"));
        setStatus(message || `${workflow.nodes.length} boxes · ${workflow.edges.length} arrows. Changes are saved in docs/workflow-map.json.`);
      }

      async function submitForm(form, path) {
        const body = Object.fromEntries(new FormData(form).entries());
        try {
          await request(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
          form.reset();
          await refresh("Saved workflow update.");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      document.querySelector("#utility-form").addEventListener("submit", (event) => {
        event.preventDefault();
        void submitForm(event.currentTarget, "/api/utilities");
      });
      document.querySelector("#dependency-form").addEventListener("submit", (event) => {
        event.preventDefault();
        void submitForm(event.currentTarget, "/api/dependencies");
      });
      refresh().catch((error) => setStatus(error.message, true));
    </script>
  </body>
</html>
